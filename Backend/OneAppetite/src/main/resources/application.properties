spring.application.name=OneAppetite
# Render injects the PORT env var at runtime; falls back to 8081 locally.
server.port=${PORT:8081}

# Comma-separated list of frontend origins allowed by CORS.
# Local dev defaults to http://localhost:4200. In Render, override via env var
# (e.g. CORS_ALLOWED_ORIGINS=https://oneappetite-frontend.onrender.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&trustServerCertificate=true&ssl-mode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# This tells Spring NOT to ping the DB until the app is fully started
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin registration guard - required when registering a user with role=ADMIN
app.admin.registration-secret=OA-ADMIN-SECRET-2026

# Groq API Configuration
groq.api.key=${GROQ_API_KEY}
groq.api.model=llama-3.3-70b-versatile