spring.application.name=OneAppetite
# Render injects the PORT env var at runtime; falls back to 8081 locally.
server.port=${PORT:8081}

# Comma-separated list of frontend origins allowed by CORS.
# Local dev defaults to http://localhost:4200. In Render, override via env var
# (e.g. CORS_ALLOWED_ORIGINS=https://oneappetite-frontend.onrender.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&trustServerCertificate=true&ssl-mode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Read-only DB user used ONLY by the chatbot's JdbcTemplate.
# Granted SELECT-only at the MySQL level on the chatbot_readonly user.
# Falls back to the main DB user if the read-only env vars aren't set (local dev).
spring.datasource.readonly.username=${DB_READONLY_USER:${DB_USER}}
spring.datasource.readonly.password=${DB_READONLY_PASSWORD:${DB_PASSWORD}}

# This tells Spring NOT to ping the DB until the app is fully started
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate properties
# ddl-auto=none — schema is already in Aiven; skip the slow schema-comparison
#                 step at boot. Switch back to 'update' locally if you change entities.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Faster boot on Render free tier
# Note: lazy-initialization=true and open-in-view=false were removed —
# they broke OneToMany lazy loading during DTO serialization (500 on /orders/vendor/{id}).
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Admin registration guard - required when registering a user with role=ADMIN
app.admin.registration-secret=OA-ADMIN-SECRET-2026

# Gemini API Configuration
# Empty default so the app boots even when GEMINI_API_KEY isn't set in Render.
# ChatService handles a blank key gracefully ("chatbot not configured" response).
gemini.api.key=