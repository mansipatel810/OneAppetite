<div class="chatbot-wrapper">
  <!-- Chat Window -->
  @if (open()) {
    <div class="chat-window" role="dialog" aria-label="OneBot chat">
      <div class="chat-header">
        <div class="header-info">
          <div class="bot-avatar">🤖</div>
          <div>
            <div class="bot-name">OneBot</div>
            <div class="bot-status">AI Assistant · Always online</div>
          </div>
        </div>
        <button class="close-btn" (click)="toggle()" aria-label="Close chat">✕</button>
      </div>

      <div class="messages-area">
        @for (msg of messages(); track $index) {
          <div class="message" [class.user]="msg.from === 'user'" [class.bot]="msg.from === 'bot'">
            @if (msg.from === 'bot') {
              <div class="bot-icon">🤖</div>
            }
            <div class="bubble">
              @if (msg.loading) {
                <span class="typing-dots"><span></span><span></span><span></span></span>
              } @else {
                {{ msg.text }}
              }
            </div>
          </div>
        }
        <div #messagesEnd></div>
      </div>

      <div class="input-area">
        <textarea
          [(ngModel)]="input"
          (keydown)="onEnter($event)"
          placeholder="Ask me anything about OneAppetite…"
          rows="1"
          maxlength="500"
          class="chat-input"
        ></textarea>
        <button class="send-btn" (click)="send()" [disabled]="!input.trim()" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  }

  <!-- Floating Button -->
  <button class="fab" (click)="toggle()" [class.active]="open()" aria-label="Open OneBot chat">
    @if (open()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    }
  </button>
</div>
